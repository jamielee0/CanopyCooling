stage_1:
  unit: native_ECOSTRESS_cell_within_city_pass
  fit: separate_model_for_each_city_and_pass_pooling_all_eligible_blocks
  formula: LST_K ~ 0 + C(block) + canopy_c + context_covariates_c
  formula_radiance: M_W_m2 ~ 0 + C(block) + canopy_c + context_covariates_c
  block_effect: intercept_only_no_C_block_by_canopy_interactions
  slope_output: one_canopy_slope_per_pass
  output_key:
  - city
  - pass_id
  canopy_centering: within_block_within_pass_using_identical_weights_in_both_spaces
  context_covariates_model_A:
  - impervious_fraction_c
  - low_vegetation_fraction_c
  - bare_fraction_c
  - building_fraction_c
  - elevation_c
  - distance_to_water_c
  context_processing: within_block_center_constant_terms_removed_by_fixed_rank_rule_and_logged
  paired_sample: same_deduplicated_valid_cells_covariates_weights_masks_and_bootstrap_draws_valid_T_and_epsilon_in_both_models
  additional_lst_only_sample: optional_labeled_missing_emissivity_sensitivity_not_the_paired_comparison
  M_formula: epsilon_WB * sigma * T_K^4
  sigma_W_m2_K4: 5.670374419e-08
  signed_coefficients:
    temperature: delta_T_10pp = 0.10 * beta_T
    emitted_energy: delta_M_10pp = 0.10 * beta_M
  cooling_efficiency_sign:
    temperature: CE_T = -0.10 * beta_T
    emitted_energy: CE_M = -0.10 * beta_M
  units:
    delta_T_and_CE_T: K_per_10_percentage_points_canopy
    delta_M_and_CE_M: W_m-2_per_10_percentage_points_canopy
  model_B_role: secondary_radiative_standardization_only_albedo_incoming_and_net_radiation_after_QA_not_total_primary_model
  uncertainty: spatial_block_bootstrap_resample_whole_1km_blocks_with_all_cells_refit_both_models_use_fresh_IDs_for_repeated_draws
  bootstrap_replicates_planning_default: 1000
  random_seed_planning_default: 20260919
  bootstrap_default_status: FROZEN_BEFORE_RUN
  spatial_dependence_sensitivity: 2km_groups_in_main_run; residual_neighbor_diagnostic_and_4km_8km_stress_checks_in_separate_prefrozen_run
  registration_sensitivity: four_cardinal_shifts_dx_dy_of_one_native_cell; no_wrap_or_thermal_resampling
  composition_sensitivity: exact_common_native_cells_across_all_five_passes_within_city
  point_estimates: raw_models_sealed; original_LST_gradients_and_20260921_LST_plot_explicitly_disclosed; no_global_blindness_claim
  no_expected_sign_gate: true
  validity_rule: finite_positive_LST_K_and_finite_valid_context_canopy_and_emissivity_after_product_scaling_apply_frozen_collection_specific_QC_cloud_land_and_geometry_masks
temperature_equivalent_standardization:
  status: IMPLEMENTED_RULE_FROZEN_NUMBERS_IN_EXECUTION_OUTPUT
  reference_distribution: all_valid_rows_in_blocks_supporting_both_endpoints; equal_cell_weights_within_pass; equal_pass_within_city_and_equal_city_references
  canopy_pair:
    f0: null
    f1: f0+0.10
    rule: maximize_minimum_supporting_block_count_across_passes; ties_lower_f0; do_not_remove_other_blocks_from_fit
  centered_prediction_rule: replace_raw_f_with_f0_or_f1_then_subtract_original_training_block_canopy_mean_keep_training_centers_and_covariates_fixed
  prediction_average: for_each_city_pass_average_model_predictions_over_its_frozen_reference_rows_then_aggregate_with_frozen_comparison_weights
  radiance_predictions: muM0 = weighted_mean(Mhat(f0,Xref)); muM1 = weighted_mean(Mhat(f1,Xref)); dM=muM1-muM0
  reference_temperature_K: null
  reference_emissivity: null
  reference_selection: equal_city_average_of_equal_pass_medians_of_absolute_T_and_emissivity; record_access_without_coefficient_display
  anchor: Mref = epsilon_ref * sigma * Tref^4; A0=Mref; A1=Mref + (muM1-muM0)
  exact_back_transform: delta_T_equiv = (A1/(epsilon_ref*sigma))^(1/4) - (A0/(epsilon_ref*sigma))^(1/4); CE_M_equiv
    = -delta_T_equiv
  interpretation: reference_anchored_temperature_equivalent_of_predicted_energy_difference_not_estimated_tree_temperature
  averaging_order: average_predictions_then_reanchor_and_invert_do_not_silently_average_individually_inverted_rows
  validity: A0_and_A1_must_be_positive_otherwise_report_not_estimable_at_reference
