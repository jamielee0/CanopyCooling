condition_variables:
  G:
    name: greenness_linked_condition
    definition: standardized_prepass_EVI2_anomaly_over_tree_pixels
    climatology: block_leave_one_year_out_day_of_year
  W_tree:
    name: tree_side_swir_sensitive_residual_condition
    definition: crossfitted_NDMI_on_EVI2_residual_over_tree_population
  W_bg:
    name: background_side_swir_sensitive_residual_condition
    definition: same_crossfitted_residual_over_fixed_primary_background_population
  residual_model:
    response: NDMI
    predictors: [EVI2, day_of_year, sensor, optical_age_days, source_date, city, block]
    crossfit: leave_one_year_out
    outcome_blind: true
  formulas:
    EVI2: "2.5 * (NIR - RED) / (NIR + 2.4 * RED + 1.0)"
    NDMI: "(NIR - SWIR1) / (NIR + SWIR1)"
    W: "NDMI_observed - NDMI_predicted_crossfit"
  terminology_lock: swir_sensitive_residual_condition_anomaly_at_comparable_optical_greenness
  prohibited_labels: [moisture_status, leaf_water_content, canopy_water_potential, physiological_stress, stomatal_closure, tree_health]
  alternative:
    name: tasseled_cap_greenness_and_wetness
    coefficient_set: PENDING_GATE_A
    selection_rule: higher_reliability_for_both_pixel_populations_without_outcome_access
  reliability_methods: [split_half_pixels, near_coincident_HLSL30_HLSS30, short_window_replicate_acquisitions]
  minimum_reliability_each_component: 0.50
  partial_correlation_ceiling: 0.85
  fallback:
    name: difference_and_mean
    allowed_only_if_both_fallback_components_pass_all_measurement_and_power_gates: true

stage_1:
  unit: native_cell_within_block_and_thermal_pass
  response: LST_K
  formula: "LST_K ~ 0 + C(block) + C(block):canopy_c + context_covariates_c"
  canopy_centering: within_block
  context_covariates_model_A:
    - impervious_fraction_c
    - low_vegetation_fraction_c
    - bare_fraction_c
    - building_fraction_c
    - elevation_c
    - distance_to_water_c
  model_A_excludes_albedo: true
  model_B_additions:
    - uncertainty_filtered_albedo_c
    - uncertainty_filtered_incoming_radiation_c
    - uncertainty_filtered_net_radiation_c
  model_B_role: radiatively_standardized_sensitivity
  slope_output: one_canopy_slope_per_block_pass
  slope_units: kelvin_per_unit_canopy_fraction
  cooling_efficiency_formula: "CE_K_per_10pp = -0.10 * slope_K_per_fraction"
  percent_storage_conversion_formula: "CE_K_per_10pp = -10.0 * slope_K_per_percent"
  uncertainty: spatial_subblock_resampling
  nominal_pixel_count_as_independent_n: prohibited
  common_cell_or_inverse_probability_reweighted_sensitivity: required
  no_expected_sign_gate: true
  precision_pilot_point_estimates: sealed

