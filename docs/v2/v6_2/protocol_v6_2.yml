  gate_A_authorized: false

cities:
  gate_A: [phoenix, los_angeles]
  lead_city: PENDING_GATE_A
  lead_city_rule:
    first: highest_simulated_detection_power_among_cities_passing_all_gate_A_minima
    tie_tolerance_absolute_power: 0.05
    tie_breaker: highest_median_passes_per_block_in_largest_connected_component
    one_city_passes: that_city_leads
  conditional_third: minneapolis_st_paul
  alternate_third: denver_aurora

years:
  primary_complete_warm_seasons: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  science_tcc_stability: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  year_2018_role: optional_partial_year_sensitivity_only
  year_2026_role: excluded_incomplete_not_formal_holdout

season_windows:
  phoenix:
    provisional_primary:
      start: "05-15"
      end: "07-10"
      label: restricted_pre_monsoon
    sensitivity:
      start: "06-01"
      end: "09-30"
      requirements: [rainfall_covariates, rainfall_free_block_subset]
  los_angeles:
    provisional_primary:
      start: "06-01"
      end: "09-30"
    sensitivity:
      start: "05-15"
      end: "07-10"
  final_season_ruling: PENDING_GATE_A
  final_season_ruling_inputs: [rainfall_audit, optical_support]

products:
  ecostress_lste:
    role: primary_lst_and_quality_layers
    product: ECO_L2T_LSTE.003
    short_name: ECO_L2T_LSTE
    collection_version: "003"
    concept_id: C3998139651-LPCLOUD
    grid: native_70m_mgrs
    response_units: kelvin
    resample_lst: false
    processed_scale_rule: apply_metadata_scale_factor
    figure_conversion: celsius_allowed_for_figures_only
  ecostress_geometry:
    role: view_azimuth_and_relative_sun_sensor_geometry
    product: ECO_L1B_GEO.002
    collection_version: "002"
    concept_id: C2076087338-LPCLOUD
    collection_note: no_official_ECO_L1B_GEO_003_collection_identified_in_inherited_audit
  ecostress_model_B_albedo:
    product: ECO_L2T_STARS.003
    role: model_B_only_after_uncertainty_filter_and_spot_checks
  ecostress_model_B_radiation:
    product: ECO_L3T_ETAUX.003
    fields: [incoming_radiation, net_radiation]
    exclusions: [downscaled_air_temperature, humidity, soil_moisture]
  hls:
    release: HLS_V2_0
    products: [HLSL30.002, HLSS30.002]
    dois:
      HLSL30: https://doi.org/10.5067/HLS/HLSL30.002
      HLSS30: https://doi.org/10.5067/HLS/HLSS30.002
    earth_engine_collections: [NASA/HLS/HLSL30/v002, NASA/HLS/HLSS30/v002]
    spatial_resolution_m: 30
    band_map:
      HLSL30: {RED: B4, NIR: B5, SWIR1: B6}
      HLSS30: {RED: B4, NIR: B8A, SWIR1: B11}
    reflectance_scaling: apply_product_REF_SCALE_FACTOR_and_ADD_OFFSET_before_indices
    fmask_required_zero_bits: [1, 2, 3, 4, 5]
    maximum_aerosol_level_bits_6_7: 2
    role: [G, W_tree, W_bg, lead_lag_placebos]
    final_exposures_rebuilt_from_raw: true
    inherited_centered_plus_minus_15_day_product_role: free_check_count_only
  science_tcc:
    family: USFS_USGS_Science_Tree_Canopy_Cover
    exact_release_identifier: projects/gtac-data-publish/assets/TCC/Product_Version/2025-6
    product_version: "2025-6"
    verified_current_on: "2026-08-30"
    official_release_page: https://data.fs.usda.gov/geodata/rastergateway/treecanopycover/
    study_area: CONUS
    band: Science_Percent_Tree_Canopy_Cover
    standard_error_band: Science_Percent_Tree_Canopy_Cover_Standard_Error
    source_units: percent_0_to_100
    analysis_units: fraction_0_to_1
    primary_amount: stable_cell_median_2019_2025
    year_matched_amount_role: sensitivity
    modified_nlcd_canopy_allowed: false
    interpolation: never_bilinear
    exact_methods_document:
      official_url: https://data.fs.usda.gov/geodata/rastergateway/treecanopycover/docs/TCC_v2025-6_Methods.pdf
      local_path: docs/v2/v6_2/sources/TCC_v2025-6_Methods.pdf
      sha256: 260bbb48147a352234d85d3e1dca174d3f6b45ef51cd5d32a72c3f74067f3763
    annual_2019_2025_local_science_asset_inventory: PENDING_GATE_A
    inherited_nonconforming_assets:
      - path: data/raw/landcover/usfs_tcc_canopy_2025_30m.tif
        band: NLCD_Percent_Tree_Canopy_Cover
        sha256: 9edd6a9e87a702006efad87c80ab0110af328722886f4009f6ab6cbf6972c939
        disposition: retained_for_history_prohibited_as_v6_2_science_tcc
      - path: data/raw/v2/hitl/g3_sampling_design_revision/mod13q1_tcc_2018_2025_composite_ndvi.csv.provenance.json
        band: NLCD_Percent_Tree_Canopy_Cover
        sha256: 20b05ff368a60f30fddcdfcfb100e844c736e2d18879c27985dc52a86578472e
        disposition: retained_for_history_prohibited_as_v6_2_science_tcc
  meteorology:
    primary: NOAA_HRRR_operational_analysis_f00
    fields: [2m_air_temperature, 2m_dewpoint_temperature, 10m_wind]
    timing: exact_acquisition_time_linear_interpolation_between_bracketing_hours
    sensitivity: ERA5_Land
    vpd_units: kilopascal
  precipitation:
    primary: MRMS_MultiSensor_QPE_01H_Pass2
    fallback: NOAA_Stage_IV
    antecedent_windows_days: [1, 3, 7]
    role: descriptive_covariate_and_rainfall_free_subset_only
    product_availability_and_exact_local_checksums: PENDING_GATE_A
  context:
    urban_frame: 2020_Census_Urban_Areas
    land_cover: USGS_Annual_NLCD_Collection_1_1
    building_footprints: Microsoft_US_Building_Footprints_2022_snapshot
    elevation: USGS_3DEP_one_third_arc_second_DEM
    independent_aerial_validation: NAIP_or_comparable_100_cells_per_city_across_canopy_deciles

geometry:
  lst_grid: native_ECOSTRESS_MGRS
  city_block_grid:
    primary_km: 1.0
    sensitivities_km: [0.5, 2.0]
    rule: fixed_local_projected_grid_with_stable_ids_across_years_and_passes
  view_sets:
    primary:
      pass_statistic: p95_absolute_view_zenith_degrees
      maximum_degrees: 15.0
    expanded:
      pass_statistic: p95_absolute_view_zenith_degrees
      maximum_degrees: 25.0
      requires_view_azimuth: true
  cloud_before_geometry_summary: true
  relative_sun_sensor_azimuth_reported: true
  canopy_and_condition_registration_sensitivity_cells: [-1, 1]
  block_pass_min_canopy_span_p10_p90: 0.20

pixel_populations:
  canopy_fraction_units: fraction_0_to_1
  tree:
    name: tree_dominated
    tree_fraction_threshold: 0.40
    inequality: greater_than_or_equal
    provisional_basis: inherited_pre_outcome_physical_signal_floor
  background_primary:
    name: nontree_pervious_low_vegetation
    background_fraction_threshold: 0.10
    inequality: less_than_or_equal
    maximum_impervious_fraction: 0.20
    annual_nlcd_classes: [52, 71, 81, 82]
    exclude_open_water: true
    exclude_building_footprints: true
  separating_gap:
    lower_exclusive: 0.10
    upper_exclusive: 0.40
    width_fraction: 0.30
    mixed_pixels_enter_neither_population: true
  background_placebo:
    name: impervious_bare
    developed_nlcd_classes: [22, 23, 24]
    minimum_impervious_fraction: 0.50
    bare_nlcd_class: 31
  minimum_effective_tree_pixels_per_block_pass: 30
  minimum_effective_background_pixels_per_block_pass: 30
  excluded_mixed_fraction_recorded_per_block_pass: true
  threshold_change_rule: supervisor_approved_protocol_amendment_before_any_v6_2_coefficient_only

canopy_stability:
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  raw_annual_science_tcc_only: true
  primary_amount: per_cell_median_across_stable_years
  year_matched_sensitivity: true
  primary_stability_rule: annual_max_minus_min_fraction_less_than_or_equal_to_0_15
  primary_stability_tolerance_fraction: 0.15
  sensitivity_stability_tolerances_fraction: [0.10, 0.20]

optical_timing:
  minimum_lead_hours: 24
  maximum_age_days_primary: 21
  maximum_age_days_sensitivities: [14, 28]
  same_acquisition_for_EVI2_and_NDMI: true
  prefer_one_common_acquisition_per_city_pass: true
  required_fields: [optical_acquisition_id, source_date, sensor, optical_age_days, QA]
  cluster_or_resample_by_optical_acquisition: true
  future_imagery_in_antecedent_exposure: false
  final_antecedent_and_future_variables_built_separately: true

condition_variables:
  G:
    name: greenness_linked_condition
    definition: standardized_prepass_EVI2_anomaly_over_tree_pixels
    climatology: block_leave_one_year_out_day_of_year
  W_tree:
    name: tree_side_swir_sensitive_residual_condition
    definition: crossfitted_NDMI_on_EVI2_residual_over_tree_population
  W_bg:
    name: background_side_swir_sensitive_residual_condition
    definition: same_crossfitted_residual_over_fixed_primary_background_population
  residual_model:
    response: NDMI
    predictors: [EVI2, day_of_year, sensor, optical_age_days, source_date, city, block]
    crossfit: leave_one_year_out
    outcome_blind: true
  formulas:
    EVI2: "2.5 * (NIR - RED) / (NIR + 2.4 * RED + 1.0)"
    NDMI: "(NIR - SWIR1) / (NIR + SWIR1)"
    W: "NDMI_observed - NDMI_predicted_crossfit"
  terminology_lock: swir_sensitive_residual_condition_anomaly_at_comparable_optical_greenness
  prohibited_labels: [moisture_status, leaf_water_content, canopy_water_potential, physiological_stress, stomatal_closure, tree_health]
  alternative:
    name: tasseled_cap_greenness_and_wetness
    coefficient_set: PENDING_GATE_A
    selection_rule: higher_reliability_for_both_pixel_populations_without_outcome_access
  reliability_methods: [split_half_pixels, near_coincident_HLSL30_HLSS30, short_window_replicate_acquisitions]
  minimum_reliability_each_component: 0.50
  partial_correlation_ceiling: 0.85
  fallback:
    name: difference_and_mean
    allowed_only_if_both_fallback_components_pass_all_measurement_and_power_gates: true

stage_1:
  unit: native_cell_within_block_and_thermal_pass
  response: LST_K
  formula: "LST_K ~ 0 + C(block) + C(block):canopy_c + context_covariates_c"
  canopy_centering: within_block
  context_covariates_model_A:
    - impervious_fraction_c
    - low_vegetation_fraction_c
    - bare_fraction_c
    - building_fraction_c
    - elevation_c
    - distance_to_water_c
  model_A_excludes_albedo: true
  model_B_additions:
    - uncertainty_filtered_albedo_c
    - uncertainty_filtered_incoming_radiation_c
    - uncertainty_filtered_net_radiation_c
  model_B_role: radiatively_standardized_sensitivity
  slope_output: one_canopy_slope_per_block_pass
  slope_units: kelvin_per_unit_canopy_fraction
  cooling_efficiency_formula: "CE_K_per_10pp = -0.10 * slope_K_per_fraction"
  percent_storage_conversion_formula: "CE_K_per_10pp = -10.0 * slope_K_per_percent"
  uncertainty: spatial_subblock_resampling
  nominal_pixel_count_as_independent_n: prohibited
  common_cell_or_inverse_probability_reweighted_sensitivity: required
  no_expected_sign_gate: true
  precision_pilot_point_estimates: sealed

stage_2:
  unit: block_pass
  response: CE_K_per_10pp
  formula_primary: "CE ~ C(block) + C(pass) + G + W_tree + W_bg + frozen_quality_terms"
  frozen_quality_terms:
    - optical_age_days_c
    - C(sensor)
    - C(optical_acquisition_id)
    - source_date_one_sided_term
    - log1p_effective_tree_pixels_c
    - log1p_effective_background_pixels_c
    - excluded_mixed_fraction_c
    - canopy_span_p10_p90_c
    - mean_canopy_fraction_c
  demand_branch_status: PENDING_FREE_CHECK_DEMAND_GEOMETRY_RULING
  demand_branch_if_retained:
    variable: VPD_kPa
    interactions: [W_tree_x_VPD, W_bg_x_VPD]
    both_interactions_required: true
  dependence_units: [block, thermal_pass, optical_acquisition]
  city_reporting: [city_specific, equal_city_pooling, leave_one_city_out]
  precision_weights: capped
  unweighted_sensitivity: required

predicted_signs:
  scale: cooling_efficiency_CE_K_per_10pp
  theta_wt: positive
  theta_wb: negative
  slope_scale_signs_reversed: true
  same_sign_interpretation: whole_block_optical_condition_framing
  sign_consistency_is_proof_of_mechanism: false
  expected_sign_used_as_gate: false
  confirmatory_contrast: joint_opposite_sign_contrast

power:
  alpha_two_sided: 0.05
  target_power: 0.80
  meaningful_latent_effect_K_per_10pp_per_latent_SD: 0.10
  meaningful_effect_sensitivities: [0.05, 0.20]
  equivalence_bound_K_per_10pp: 0.05
  attenuation_formula: "theta_observed = theta_latent * sqrt(reliability)"
  planning_design_effect: 2.5
  closed_form_detection_constant: 7.85
  closed_form_equivalence_constant: 6.18
  detection_formula: "N >= 7.85 * D * sigma_s^2 / theta^2"
  equivalence_formula: "N >= 6.18 * D * sigma_s^2 / delta^2"
  binding_method: full_simulation_on_actual_block_pass_graph
  simulation_requirements:
    - observed_canopy_distributions
    - two_latent_correlated_condition_components
    - correlated_measurement_error
    - exact_exposure_construction_and_residualization
    - spatially_correlated_thermal_error
    - optical_acquisition_reuse_across_passes
  maximum_type_1_error: 0.05
  minimum_detection_power: 0.80
  minimum_equivalence_power: 0.80

gate_A:
  minimum_optical_availability_within_21_days: 0.70
  minimum_eligible_blocks_per_city: 30
  minimum_distinct_urban_sectors: 3
  minimum_largest_connected_component_share: 0.80
  minimum_median_passes_per_block: 8
  minimum_reliability_each_condition_component: 0.50
  fixed_primary_background_required: true
  connectivity_crossing:
    seasons: [provisional_primary, sensitivity]
    view_zenith_maximum_degrees: [15, 25]
  exact_identifying_component_required: true
  no_sign_gate: true

gate_B:
  pilot_passes_minimum: 15
  pilot_passes_maximum: 20
  minimum_stable_slope_share: 0.70
  minimum_projected_power: 0.80
  maximum_median_stage1_se_inflation_vs_plan: 0.25
  common_cell_or_reweighted_estimable: true
  registration_shift_must_preserve_estimability: true
  background_composition_stable: true
  no_expected_sign_gate: true
  coefficients_sealed_until_decision: true

secondary_analyses:
  irrigation_stratification: where_records_available
  night_diagnostic: optional_must_not_delay_core_paper

load_bearing_controls:
  - temporal_specificity
  - fixed_background_definition
  - cell_composition
  - optical_source_date_and_image_reuse
  - registration
  - geometry
  - rainfall_and_season
  - independent_reconstruction

stop_rules:
  - do_not_lower_thresholds_after_results
  - do_not_widen_windows_to_rescue_a_coefficient
  - do_not_restore_compound_threshold_paired_pixel_or_early_late_designs
  - do_not_treat_rainfall_as_direct_tree_water_supply
  - stop_or_explicitly_reframe_if_gate_A_or_gate_B_fails
